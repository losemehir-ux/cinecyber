<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Huafsnet - Ultimate Movie Database</title>
    <style>
        :root {
            --bg-color: #071f1c;
            --text-color: #e0f7fa;
            --card-bg: #0d2b27;
            --header-bg: #031412;
            --header-text: #00e5ff;
            --border-color: #004d40;
            --accent-glow: rgba(0, 229, 255, 0.2);
        }

        [data-theme="light"] {
            --bg-color: #e0f2f1;
            --text-color: #00251a;
            --card-bg: #ffffff;
            --header-bg: #004d40;
            --header-text: #80d8ff;
            --border-color: #b2dfdb;
            --accent-glow: rgba(0, 0, 0, 0.1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            transition: background 0.3s ease, color 0.3s ease, transform 0.2s ease;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
        }

        header {
            background-color: var(--header-bg);
            color: var(--header-text);
            padding: 1.5rem 3rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 3px solid #00e5ff;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .logo-area {
            display: flex;
            flex-direction: column;
        }

        .logo {
            font-size: 2.3rem;
            font-weight: 900;
            letter-spacing: 2px;
            color: #00e5ff;
            text-transform: uppercase;
            text-shadow: 0 0 10px rgba(0, 229, 255, 0.5);
        }

        .tagline {
            font-size: 0.8rem;
            opacity: 0.7;
            letter-spacing: 1px;
        }

        .search-container {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        #searchBox {
            padding: 12px 18px;
            width: 340px;
            border-radius: 30px;
            border: 2px solid var(--border-color);
            background: rgba(0, 0, 0, 0.3);
            color: var(--text-color);
            outline: none;
            font-size: 1rem;
        }

        #searchBox:focus {
            border-color: #00e5ff;
            box-shadow: 0 0 10px var(--accent-glow);
        }

        #searchBox::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }

        .theme-toggle {
            background: #00e5ff;
            color: #031412;
            border: none;
            padding: 10px 18px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 30px;
            font-size: 0.9rem;
            box-shadow: 0 0 10px rgba(0, 229, 255, 0.3);
        }

        .theme-toggle:hover {
            background: #80d8ff;
            transform: scale(1.05);
        }

        .nav-categories {
            display: flex;
            gap: 15px;
            padding: 15px 3rem;
            background: var(--card-bg);
            border-bottom: 2px solid var(--border-color);
            overflow-x: auto;
        }

        .cat-btn {
            background: transparent;
            border: 2px solid var(--border-color);
            color: var(--text-color);
            font-weight: 700;
            cursor: pointer;
            padding: 8px 18px;
            border-radius: 20px;
            font-size: 0.95rem;
            white-space: nowrap;
        }

        .cat-btn.active, .cat-btn:hover {
            background: #00e5ff;
            color: #031412;
            border-color: #00e5ff;
            box-shadow: 0 0 10px rgba(0, 229, 255, 0.4);
        }

        .container {
            max-width: 1400px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .movies-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 25px;
            margin-bottom: 40px;
        }

        .movie-card {
            background: var(--card-bg);
            border: 2px solid var(--border-color);
            border-radius: 12px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.4);
        }

        .movie-card:hover {
            transform: translateY(-5px);
            border-color: #00e5ff;
            box-shadow: 0 10px 25px rgba(0, 229, 255, 0.2);
        }

        .movie-card img {
            width: 100%;
            height: 310px;
            object-fit: cover;
            background-color: #071f1c;
        }

        .movie-info {
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            flex-grow: 1;
        }

        .movie-title {
            font-size: 1.1rem;
            font-weight: bold;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .movie-meta {
            font-size: 0.9rem;
            opacity: 0.85;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .rating {
            color: #00e5ff;
            font-weight: bold;
        }

        .detail-btn {
            display: block;
            text-align: center;
            background: #00e5ff;
            color: #031412;
            padding: 10px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: bold;
            margin-top: auto;
            box-shadow: 0 4px 10px rgba(0, 229, 255, 0.2);
        }

        .detail-btn:hover {
            background: #4dd0e1;
            box-shadow: 0 6px 15px rgba(0, 229, 255, 0.4);
        }

        /* Modal Popup Styles */
        .modal {
            display: none;
            position: fixed;
            z-index: 2000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(5px);
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background: var(--card-bg);
            border: 2px solid #00e5ff;
            padding: 30px;
            border-radius: 15px;
            width: 90%;
            max-width: 500px;
            position: relative;
            box-shadow: 0 10px 30px rgba(0, 229, 255, 0.3);
        }

        .close-btn {
            position: absolute;
            top: 15px;
            right: 20px;
            font-size: 1.8rem;
            color: #00e5ff;
            cursor: pointer;
            font-weight: bold;
        }

        .modal-title {
            font-size: 1.5rem;
            color: #00e5ff;
            margin-bottom: 10px;
        }

        .modal-details {
            font-size: 0.95rem;
            opacity: 0.9;
            margin-bottom: 15px;
        }

        .modal-desc {
            font-size: 0.9rem;
            line-height: 1.6;
            opacity: 0.8;
        }

        footer {
            background-color: var(--header-bg);
            color: var(--text-color);
            text-align: center;
            padding: 25px;
            border-top: 2px solid var(--border-color);
            margin-top: 50px;
            font-size: 0.95rem;
            opacity: 0.8;
        }

        @media(max-width: 768px) {
            header {
                flex-direction: column;
                gap: 15px;
                padding: 1rem;
                text-align: center;
            }
            .search-container {
                width: 100%;
                justify-content: center;
                flex-direction: column;
            }
            #searchBox {
                width: 100%;
            }
            .nav-categories {
                padding: 10px 1rem;
            }
        }
    </style>
</head>
<body data-theme="dark">

    <header>
        <div class="logo-area">
            <div class="logo">Huafsnet</div>
            <div class="tagline">Your Ultimate Cinematic Database</div>
        </div>
        <div class="search-container">
            <input type="text" id="searchBox" placeholder="Search Hollywood, Bollywood, K-Dramas..." onkeyup="filterMovies()">
            <button class="theme-toggle" onclick="toggleTheme()">Theme</button>
        </div>
    </header>

    <div class="nav-categories">
        <button class="cat-btn active" onclick="filterCategory('all', this)">All Masterpieces</button>
        <button class="cat-btn" onclick="filterCategory('hollywood', this)">Hollywood</button>
        <button class="cat-btn" onclick="filterCategory('bollywood', this)">Bollywood</button>
        <button class="cat-btn" onclick="filterCategory('korean', this)">Korean / K-Dramas</button>
    </div>

    <div class="container">
        <div class="movies-grid" id="moviesGrid">
            <!-- Rendered dynamically -->
        </div>
    </div>

    <!-- Modal Popup for Movie Details -->
    <div id="movieModal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal()">&times;</span>
            <h2 id="modalTitle" class="modal-title"></h2>
            <p id="modalMeta" class="modal-details"></p>
            <p id="modalDesc" class="modal-desc"></p>
        </div>
    </div>

    <footer>
        &copy; 2026 Huafsnet Database. Built for true cinema lovers. All rights reserved.
    </footer>

    <script>
        // 100% stable Wikimedia/External hosted image database links with detailed info built-in
        const movies = [
            // Hollywood Hits
            { 
                title: "The Pursuit of Happyness", 
                category: "hollywood", 
                year: 2006, 
                rating: 8.0, 
                img: "https://upload.wikimedia.org/wikipedia/en/8/81/The_Pursuit_of_Happyness.png", 
                desc: "A struggling salesman takes custody of his son as he's poised to begin a life-changing professional career.",
                director: "Gabriele Muccino",
                cast: "Will Smith, Thandie Newton, Jaden Smith"
            },
            { 
                title: "Fight Club", 
                category: "hollywood", 
                year: 1999, 
                rating: 8.8, 
                img: "https://upload.wikimedia.org/wikipedia/en/f/fc/Fight_Club_poster.jpg", 
                desc: "An insomniac office worker and a devil-may-care soap maker form an underground fight club that evolves into much more.",
                director: "David Fincher",
                cast: "Brad Pitt, Edward Norton, Helena Bonham Carter"
            },
            { 
                title: "Inception", 
                category: "hollywood", 
                year: 2010, 
                rating: 8.8, 
                img: "https://upload.wikimedia.org/wikipedia/en/2/2e/Inception_%282010%29_theatrical_poster.jpg", 
                desc: "A thief who steals corporate secrets through the use of dream-sharing technology is given the inverse task of planting an idea.",
                director: "Christopher Nolan",

            },
            {

                rating: 8.7, 
                img: "https://upload.wikimedia.org/wikipedia/en/b/bc/Interstellar_film_poster.jpg", 
                desc: "A team of explorers travel through a wormhole in space in an attempt to ensure humanity's survival.",
                director: "Christopher Nolan",
                cast: "Matthew McConaughey, Anne Hathaway, Jessica Chastain"
            },
            { 
                title: "The Dark Knight", 
                category: "hollywood", 
                year: 2008, 
                rating: 9.0, 
                img: "https://upload.wikimedia.org/wikipedia/en/8/8a/Dark_Knight_poster.jpg", 
                desc: "When the menace known as the Joker wreaks havoc and chaos on the people of Gotham, Batman must accept one of the greatest psychological and physical tests.",
                director: "Christopher Nolan",
                cast: "Christian Bale, Heath Ledger, Aaron Eckhart"
            },

            // Bollywood Masterpieces
            { 
                title: "3 Idiots", 
                category: "bollywood", 
                year: 2009, 
                rating: 8.4, 
                img: "https://upload.wikimedia.org/wikipedia/en/df/3_idiots_poster.jpg", 
                desc: "Two friends search for their long lost companion. They revisit their college days and recall the memories of their friend who inspired them.",
                director: "Rajkumar Hirani",
                cast: "Aamir Khan, R. Madhavan, Sharman Joshi"
            },
            { 
                title: "Dangal", 
                category: "bollywood", 
                year: 2016, 
                rating: 8.4, 
                img: "https://upload.wikimedia.org/wikipedia/en/9/99/Dangal_poster.jpg", 
                desc: "Former wrestler Mahavir Singh Phogat trains his daughters to become world-class wrestlers against all societal odds.",
                director: "Nitesh Tiwari",
                cast: "Aamir Khan, Fatima Sana Shaikh, Sanya Malhotra"
            },
            { 
                title: "Pathaan", 
                category: "bollywood", 
                year: 2023, 
                rating: 6.0, 
                img: "https://upload.wikimedia.org/wikipedia/en/c/c7/Pathaan_film_poster.jpg", 
                desc: "An exiled RAW agent is assigned to take down a ruthless terrorist outfit planning a massive attack on India.",
                director: "Siddharth Anand",
                cast: "Shah Rukh Khan, Deepika Padukone, John Abraham"
            },
            { 
                title: "Jawan", 
                category: "bollywood", 
                year: 2023, 
                rating: 7.1, 
                img: "https://upload.wikimedia.org/wikipedia/en/3/39/Jawan_film_poster.jpg", 
                desc: "A high-octane action thriller outlines the emotional journey of a man who is set to rectify the wrongs in society.",
                director: "Atlee",
                cast: "Shah Rukh Khan, Nayanthara, Vijay Sethupathi"
            },
            { 
                title: "Shershaah", 
                category: "bollywood", 
                year: 2021, 
                rating: 8.4, 
                img: "https://upload.wikimedia.org/wikipedia/en/1/1e/Shershaah_poster.jpg", 
                desc: "The biographical story of Indian Army captain Vikram Batra, awarded the Param Vir Chakra posthumously.",
                director: "Vishnu Varadhan",
                cast: "Sidharth Malhotra, Kiara Advani"
            },

            // Korean Sensations
            { 
                title: "Squid Game", 
                category: "korean", 
                year: 2021, 
                rating: 8.0, 
                img: "https://upload.wikimedia.org/wikipedia/en/d/dd/Squid_Game_poster.jpg", 
                desc: "Hundreds of cash-strapped players accept an invitation to compete in children's games for a tempting prize, with deadly stakes.",
                director: "Hwang Dong-hyuk",
                cast: "Lee Jung-jae, Park Hae-soo, Wi Ha-jun"
            },
            { 
                title: "All of Us Are Dead", 
                category: "korean", 
                year: 2022, 
                rating: 8.4, 
                img: "https://upload.wikimedia.org/wikipedia/en/3/33/All_of_Us_Are_Dead_poster.jpg", 
                desc: "A high school becomes ground zero for a zombie virus outbreak. Trapped students must fight their way out or turn into the infected.",
                director: "Lee Joo-kyung, Kim Nam-su",
                cast: "Park Ji-hu, Yoon Chan-young, Cho Yi-hyun"
            },
            { 
                title: "Weak Hero Class 1", 
                category: "korean", 
                year: 2022, 
                rating: 8.8, 
                img: "https://upload.wikimedia.org/wikipedia/en/0/03/Weak_Hero_Class_1.jpg", 
                desc: "A model student uses his intelligence to fight back against the relentless violence happening inside and outside of his school.",
                director: "You Soo-min",
                cast: "Park Ji-hoon, Choi Hyun-wook, Hong Kyung"
            },
            { 
                title: "Train to Busan", 
                category: "korean", 
                year: 2016, 
                rating: 7.6, 
                img: "https://upload.wikimedia.org/wikipedia/en/d/da/Train_to_Busan_poster.jpg", 
                desc: "While a zombie virus breaks out in South Korea, passengers struggle to survive on the train from Seoul to Busan.",
                director: "Yeon Sang-ho",
                cast: "Gong Yoo, Jung Yu-mi, Ma Dong-seok"
            },
            { 
                title: "Parasite", 
                category: "korean", 
                year: 2019, 
                rating: 8.5, 
                img: "https://upload.wikimedia.org/wikipedia/en/5/53/Parasite_%282019_film%29.png", 
                desc: "Greed and class discrimination threaten the newly formed symbiotic relationship between the wealthy Park family and the destitute Kim clan.",
                director: "Bong Joon-ho",
                cast: "Song Kang-ho, Lee Sun-kyun, Cho Yeo-jeong"
            }
        ];

        let currentCategory = 'all';

        function displayMovies(items) {
            const grid = document.getElementById('moviesGrid');
            grid.innerHTML = '';
            
            if (items.length === 0) {
                grid.innerHTML = '<p style="grid-column: 1/-1; text-align: center; padding: 40px; font-size: 1.2rem; opacity: 0.7;">No movies found matching your search.</p>';
                return;
            }

            items.forEach((movie, index) => {
                const card = document.createElement('div');
                card.className = 'movie-card';
                card.innerHTML = `
                    <img src="${movie.img}" alt="${movie.title}" loading="lazy">
                    <div class="movie-info">
                        <div class="movie-title">${movie.title}</div>
                        <div class="movie-meta">
                            <span>${movie.year}</span>
                            <span class="rating">★ ${movie.rating}</span>
                        </div>
                        <button class="detail-btn" onclick="openModal(${index})">Movie Details</button>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function openModal(index) {
            const movie = movies[index];
            document.getElementById('modalTitle').innerText = movie.title;
            document.getElementById('modalMeta').innerHTML = `<strong>Released:</strong> ${movie.year} | <strong>Rating:</strong> ★ ${movie.rating}<br><strong>Director:</strong> ${movie.director}<br><strong>Cast:</strong> ${movie.cast}`;
            document.getElementById('modalDesc').innerText = movie.desc;
            document.getElementById('movieModal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('movieModal').style.display = 'none';
        }

        window.onclick = function(event) {
            const modal = document.getElementById('movieModal');
            if (event.target === modal) {
                closeModal();
            }
        }

        function filterMovies() {
            const query = document.getElementById('searchBox').value.toLowerCase();
            const filtered = movies.filter(movie => {
                const matchesSearch = movie.title.toLowerCase().includes(query);
                const matchesCategory = currentCategory === 'all' || movie.category === currentCategory;
                return matchesSearch && matchesCategory;
            });
            displayMovies(filtered);
        }

        function filterCategory(category, btn) {
            currentCategory = category;
            document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            filterMovies();
        }

        function toggleTheme() {
            const body = document.body;
            body.setAttribute('data-theme', body.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
        }

        displayMovies(movies);
    </script>
</body>
</html>

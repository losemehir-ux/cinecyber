        /* Modal Popup Styles */
        .modal {
            display: none;

        footer {

</head>
<body>

    <header>
        <div class="logo">huzafnet</div>
        <input type="text" id="searchInput" class="search-box" placeholder="Search movies or series..." onkeyup="filterMovies()">
        <button class="theme-toggle-btn" id="themeBtn" onclick="toggleTheme()">
    <span id="themeIcon">☀️</span> <span id="themeText">Light Mode</span>
</button>

    <div class="main-container">
        <div class="section-header">
            <h2>Curated Masterpieces</h2>
        </div>
        
        <div class="movie-grid" id="movieGrid">
            <!-- Dynamic Cards -->
        </div>

        <div class="rating-section">
            <h3>Your feedback matters to us—help us improve with your rating!</h3>
            <div class="stars-container" id="starContainer">
                <span data-value="1">★</span>
                <span data-value="2">★</span>
                <span data-value="3">★</span>
                <span data-value="4">★</span>
                <span data-value="5">★</span>
            </div>
            <textarea id="feedbackText" placeholder="Write your feedback here..."></textarea>
            <br>
            <button class="submit-rating-btn" onclick="submitRating()">Submit Rating</button>
        </div>
    </div>

    <!-- Movie Details Modal -->
    <div class="modal" id="movieModal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal()">&times;</span>
            <div class="modal-body">
                <img id="modalCharImg" src="" alt="Main Character">
                <div class="modal-details">
                    <h3 id="modalTitle"></h3>
                    <p><strong>Rating:</strong> <span id="modalRating"></span>/10</p>
                    <p><strong>Main Character:</strong> <span id="modalCharacter"></span></p>
                    <p id="modalDesc"></p>
                </div>
            </div>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 CineCyber Database. Developed by Huzaifa.</p>
    </footer>

    <script>
        const moviesData = [
            { id: 1, title: "The Matrix", rating: "8.7", poster: "https://image.tmdb.org/t/p/w500/f89U3ADr1oiB1s9GkdPOEpXUk5H.jpg", character: "Neo (Keanu Reeves)", charImg: "https://image.tmdb.org/t/p/w500/8uO0gUM8aNqYLs1OsTBQiXu0fEv.jpg", desc: "A computer hacker learns from mysterious rebels about the true nature of his reality and his role in the war against its controllers." },
            { id: 2, title: "Interstellar", rating: "8.7", poster: "https://image.tmdb.org/t/p/w500/gEU2QniE6E77NI6lCU6MxlNBvIx.jpg", character: "Joseph Cooper (Matthew McConaughey)", charImg: "https://image.tmdb.org/t/p/w500/wmdGdbNCwWbW4D01W3YV3ZkX6bK.jpg", desc: "A team of explorers travel through a wormhole in space in an attempt to ensure humanity's survival." },
            { id: 3, title: "Inception", rating: "8.8", poster: "https://image.tmdb.org/t/p/w500/edv5CZvWj09upOsy2Y6IwDhK8bt.jpg", character: "Dom Cobb (Leonardo DiCaprio)", charImg: "https://image.tmdb.org/t/p/w500/wo2hJpn04vbtmh0B9utCFdsQhxM.jpg", desc: "A thief who steals corporate secrets through the use of dream-sharing technology is given the inverse task of planting an idea." },
            { id: 4, title: "Breaking Bad", rating: "9.5", poster: "https://image.tmdb.org/t/p/w500/ggFHVNu6YYI5L9pCfOacjizRGt.jpg", character: "Walter White (Bryan Cranston)", charImg: "https://image.tmdb.org/t/p/w500/7JiedWbGEHA6eZ3A7bA562B28h9.jpg", desc: "A chemistry teacher diagnosed with inoperable lung cancer turns to manufacturing and selling methamphetamine with a former student." },
            { id: 5, title: "Fight Club", rating: "8.8", poster: "https://image.tmdb.org/t/p/w500/bptfVGEQuv6vDTIMVCHjJ9Dz8PX.jpg", character: "Tyler Durden (Brad Pitt)", charImg: "https://image.tmdb.org/t/p/w500/cckcYNYLHJjMWYDZVXlX5pQJdFR.jpg", desc: "An insomniac office worker and a devil-may-care soap maker form an underground fight club that evolves into something much more." },
            { id: 6, title: "The Dark Knight", rating: "9.0", poster: "https://image.tmdb.org/t/p/w500/qJ2tW6WMUDux911r6m7haRef0WH.jpg", character: "Batman / Bruce Wayne (Christian Bale)", charImg: "https://image.tmdb.org/t/p/w500/qYNmzIOrcmR8A0WlE7wYJ5hNkhD.jpg", desc: "When the menace known as the Joker wreaks havoc and chaos on the people of Gotham, Batman must accept one of the greatest psychological tests." },
            { id: 7, title: "Pulp Fiction", rating: "8.9", poster: "https://image.tmdb.org/t/p/w500/d5iIlFn5s0ImszYzBPb8JPIfbXD.jpg", character: "Vincent Vega (John Travolta)", charImg: "https://image.tmdb.org/t/p/w500/fiodx81qjYn9XjRk0l72K3yXk5z.jpg", desc: "The lives of two mob hitmen, a boxer, a gangster and his wife, and a pair of diner bandits intertwine in four tales of violence and redemption." },
            { id: 8, title: "Gladiator", rating: "8.5", poster: "https://image.tmdb.org/t/p/w500/ty8TGRuvJLPUmAR1H1nRIsgwvim.jpg", character: "Maximus (Russell Crowe)", charImg: "https://image.tmdb.org/t/p/w500/cQvc5q5u40qQx4cZ6v1j3R6Y9yL.jpg", desc: "A former Roman general sets out to exact vengeance against the corrupt emperor who murdered his family and sent him into slavery." },
            { id: 9, title: "Blade Runner 2049", rating: "8.0", poster: "https://image.tmdb.org/t/p/w500/gajva2L0rPYkEWjzgFlBXCAVBE5.jpg", character: "K (Ryan Gosling)", charImg: "https://image.tmdb.org/t/p/w500/lyUyRH8JqA0L0zB1oQ0FjJ4h4q9.jpg", desc: "Young Blade Runner K's discovery of a long-buried secret leads him to track down former Blade Runner Rick Deckard." },
            { id: 10, title: "Spider-Man: Into the Spider-Verse", rating: "8.4", poster: "https://image.tmdb.org/t/p/w500/iiZZdoQBEYBv6id8su7ImL0oCbD.jpg", character: "Miles Morales", charImg: "https://image.tmdb.org/t/p/w500/q2g1gN4J1Vj9cZqjY3hW7u5X7Vb.jpg", desc: "Teenager Miles Morales becomes the Spider-Man of his universe, and must join with five spider-powered counterparts from other dimensions." },
            { id: 11, title: "Avatar", rating: "7.9", poster: "https://image.tmdb.org/t/p/w500/kyeShkV8swvHmiw8rK3bZc3xP4z.jpg", character: "Jake Sully (Sam Worthington)", charImg: "https://image.tmdb.org/t/p/w500/7vXjXqgE9y8K42X377K7hXm8x2z.jpg", desc: "A paraplegic marine dispatched to the moon Pandora on a unique mission becomes torn between following his orders and protecting the world." },
            { id: 12, title: "Avengers: Endgame", rating: "8.4", poster: "https://image.tmdb.org/t/p/w500/or06FN3Dka5tukK1e9sl16pB3iy.jpg", character: "Iron Man / Tony Stark (Robert Downey Jr.)", charImg: "https://image.tmdb.org/t/p/w500/5qHNjhtjMD4YWH3UP0rm4tKwxCL.jpg", desc: "After the devastating events of Infinity War, the universe is in ruins. The Avengers assemble once more to reverse Thanos' actions." },
            { id: 13, title: "Joker", rating: "8.4", poster: "https://image.tmdb.org/t/p/w500/udDclJoHjfjb8Ekgsd4FDteOkCU.jpg", character: "Arthur Fleck (Joaquin Phoenix)", charImg: "https://image.tmdb.org/t/p/w500/zslCZw9zC5iFqQZt5FkE609dJ.jpg", desc: "In Gotham City, mentally troubled comedian Arthur Fleck is disregarded and mistreated by society, embarking on a downward spiral." },
            { id: 14, title: "Parasite", rating: "8.5", poster: "https://image.tmdb.org/t/p/w500/7IiTTgloJzvGI1TAYymCfbfl3vT.jpg", character: "Kim Ki-taek (Song Kang-ho)", charImg: "https://image.tmdb.org/t/p/w500/t8K7e1VfB6jW21B8pM4yN6V7J2x.jpg", desc: "Greed and class discrimination threaten the newly formed symbiotic relationship between the wealthy Park family and the destitute Kim clan." },
            { id: 15, title: "The Lord of the Rings: The Fellowship of the Ring", rating: "8.8", poster: "https://image.tmdb.org/t/p/w500/6oom5QYQ2yQTMJIbnvbkBL9cHo6.jpg", character: "Frodo Baggins (Elijah Wood)", charImg: "https://image.tmdb.org/t/p/w500/6Wv1g8lGjW21B8pM4yN6V7J2x.jpg", desc: "A meek Hobbit from the Shire and eight companions set out on a journey to destroy the powerful One Ring and save Middle-earth." }
        ];

        let selectedRating = 0;
        const stars = document.querySelectorAll('#starContainer span');

        stars.forEach(star => {
            star.addEventListener('click', function() {
                selectedRating = this.getAttribute('data-value');
                stars.forEach(s => {
                    if(s.getAttribute('data-value') <= selectedRating) {
                        s.classList.add('selected');
                    } else {
                        s.classList.remove('selected');
                    }
                });
            });
        });

        // Google Sheet Web App URL
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzbffmE_rXta78txzMDw7GLKbaXfeZa0aG08lJw0Ba2CPJKqludcLjucfULCn7DZ5kt/exec';

        function submitRating() {
            const feedback = document.getElementById('feedbackText').value;
            const submitBtn = document.querySelector('.submit-rating-btn');

            if (selectedRating === 0) {
                alert("Please select at least 1 star before submitting!");
                return;
            }

            submitBtn.disabled = true;
            submitBtn.innerText = "Submitting...";

            const data = {
                rating: selectedRating,
                feedback: feedback
            };

            fetch(SCRIPT_URL, {
                method: 'POST',
                mode: 'no-cors',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify(data)
            })
            .then(() => {
                alert(`Thank you for rating our website ${selectedRating} stars! ❤️`);
                selectedRating = 0;
                document.getElementById('feedbackText').value = "";
                stars.forEach(s => s.classList.remove('selected'));
                submitBtn.disabled = false;
                submitBtn.innerText = "Submit Rating";
            })
            .catch(error => {
                console.error('Error!', error);
                alert("Something went wrong. Please try again.");
                submitBtn.disabled = false;
                submitBtn.innerText = "Submit Rating";
            });
        }

        // Render Movie Grid Function
        function displayMovies(movies) {
            const grid = document.getElementById('movieGrid');
            grid.innerHTML = "";
            if (movies.length === 0) {
                grid.innerHTML = "<p style='color: #777; grid-column: 1/-1; text-align: center;'>No movies found!</p>";
                return;
            }
            movies.forEach(movie => {
                const card = document.createElement('div');
                card.className = 'movie-card';
                card.innerHTML = `
                    <div class="poster-box">
                        <img src="${movie.poster}" alt="${movie.title}" loading="lazy">
                    </div>
                    <div class="movie-info">
                        <div class="rating-row">
                            <span class="star">★</span>
                            <span><strong>${movie.rating}</strong>/10</span>
                        </div>
                        <span class="movie-title">${movie.title}</span>
                        <button class="card-btn" onclick="openModal(${movie.id})">Details</button>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        // Search Filter Function
        function filterMovies() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const filtered = moviesData.filter(movie => 
                movie.title.toLowerCase().includes(query) || 
                movie.character.toLowerCase().includes(query)
            );
            displayMovies(filtered);
        }

        // Initial render
        displayMovies(moviesData);

        // Modal Functions
        function openModal(id) {
            const movie = moviesData.find(m => m.id === id);
            if (movie) {
                document.getElementById('modalTitle').innerText = movie.title;
                document.getElementById('modalRating').innerText = movie.rating;
                document.getElementById('modalCharacter').innerText = movie.character;
                document.getElementById('modalDesc').innerText = movie.desc;
                document.getElementById('modalCharImg').src = movie.charImg;
                document.getElementById('movieModal').style.display = 'flex';
            }
        }

        function closeModal() {
            document.getElementById('movieModal').style.display = 'none';
        }

        window.onclick = function(event) {
            const modal = document.getElementById('movieModal');
            if (event.target === modal) {
                modal.style.display = 'none';
            }
        }
        function toggleTheme() {
    const body = document.body;
    const themeIcon = document.getElementById('themeIcon');
    const themeText = document.getElementById('themeText');

    if (body.getAttribute('data-theme') === 'dark') {
        body.setAttribute('data-theme', 'light');
        themeIcon.innerText = '🌙';
        themeText.innerText = 'Dark Mode';
    } else {
        body.setAttribute('data-theme', 'dark');
        themeIcon.innerText = '☀️';
        themeText.innerText = 'Light Mode';
    }
        }
        <body data-theme="dark">
    </script>
</body>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Curated Smart Finds | Best Deals Online</title>
    <style>
        :root {
            --primary-color: #ff4757;
            --bg-color: #f1f2f6;
            --card-bg: #ffffff;
            --text-color: #2f3542;
            --text-muted: #747d8c;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: '-apple-system', BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
            padding-bottom: 60px;
        }

        /* Header / Branding */
        header {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(10px);
            position: sticky;
            top: 0;
            z-index: 1000;
            text-align: center;
            padding: 20px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
            border-bottom: 1px solid rgba(255, 255, 255, 0.4);
        }

        header h1 {
            font-size: 1.8rem;
            color: var(--text-color);
            font-weight: 800;
        }

        header h1 span {
            color: var(--primary-color);
        }

        header p {
            font-size: 0.9rem;
            color: var(--text-muted);
            margin-top: 5px;
        }

        /* Product Grid Grid Layout */
        .container {
            max-width: 1200px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 25px;
        }

        /* Product Card Styling */
        .card {
            background: var(--card-bg);
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.04);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            display: flex;
            flex-direction: column;
            border: 1px solid rgba(0,0,0,0.02);
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
        }

        .image-container {
            position: relative;
            padding-top: 100px%; /* Forces 1:1 Aspect Ratio */
            overflow: hidden;
            background-color: #f7f7f7;
        }

        .card-img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
        }

        .card:hover .card-img {
            transform: scale(1.05);
        }

        .badge {
            position: absolute;
            top: 15px;
            left: 15px;
            background: var(--primary-color);
            color: white;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: bold;
            text-transform: uppercase;
        }

        .card-content {
            padding: 20px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        .card-title {
            font-size: 1rem;
            font-weight: 600;
            color: var(--text-color);
            margin-bottom: 8px;
            line-height: 1.4;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            height: 2.8em; 
        }

        .price-container {
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .current-price {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--primary-color);
        }

        .old-price {
            font-size: 0.9rem;
            color: var(--text-muted);
            text-decoration: line-through;
        }

        .cta-btn {
            display: block;
            text-align: center;
            background: var(--text-color);
            color: white;
            padding: 12px;
            border-radius: 10px;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.95rem;
            transition: background 0.2s ease;
            margin-top: auto;
        }

        .cta-btn:hover {
            background: var(--primary-color);
        }

        /* Responsive Fixes */
        @media (max-width: 600px) {
            .product-grid {
                grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
                gap: 15px;
            }
            .card-title {
                font-size: 0.9rem;
            }
            .current-price {
                font-size: 1.1rem;
            }
            .container {
                padding: 0 10px;
            }
        }
    </style>
</head>
<body>

    <header>
        <h1>SmartFinds<span>.Deals</span></h1>
        <p>Handpicked Top-Rated Viral Trends & Gadgets from AliExpress</p>
    </header>

    <div class="container">
        <div class="product-grid">

            <div class="card">

                </div>
                <div class="card-content">

                    <div class="price-container">
                        <span class="current-price">$19.99</span>

                    </div>
                    <!-- Replace with your AliExpress Affiliate Link -->
                    <a href="YOUR_ALIEXPRESS_AFFILIATE_LINK_HERE" target="_blank" rel="nofollow noopener" class="cta-btn">Check Price on AliExpress</a>
                </div>
            </div>

            <!-- Product Card 2 -->
            <div class="card">
                <div style="position: relative; width: 100%; padding-top: 100%;">
                    <span class="badge">50% OFF</span>
                    <img src="https://unsplash.com" alt="Product Image" class="card-img">
                </div>
                <div class="card-content">

                    <div class="price-container">

                    <a href="YOUR_ALIEXPRESS_AFFILIATE_LINK_HERE" target="_blank" rel="nofollow noopener" class="cta-btn">Check Price on AliExpress</a>
                </div>
            </div>

            <!-- Add more product cards by copying the structure above -->

        </div>
    </div>

</body>
                        </html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>huzfasnet - Movie Hub</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #0b0b0b;
            color: #f1f1f1;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 480px;
        }

        /* Logo */
        .logo {
            background-color: #f3cc00;
            color: #000;
            font-weight: 900;
            font-size: 22px;
            padding: 6px 14px;
            border-radius: 6px;
            display: inline-block;
            margin-bottom: 15px;
            letter-spacing: 0.5px;
        }

        /* Search Box */
        .search-box {
            width: 100%;
            background-color: #1a1a1a;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 12px 15px;
            color: #fff;
            font-size: 15px;
            outline: none;
            margin-bottom: 15px;
        }

        .search-box::placeholder {
            color: #888;
        }

        /* Dark Mode Button */
        .theme-btn {
            background-color: #1a1a1a;
            color: #fff;
            border: 1px solid #333;
            padding: 8px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 25px;
            font-weight: 500;
        }

        /* Category Filter Buttons */
        .categories-nav {
            display: flex;
            gap: 8px;
            margin-bottom: 25px;
            overflow-x: auto;
            padding-bottom: 5px;
        }

        .cat-btn {
            background-color: #1a1a1a;
            color: #aaa;
            border: 1px solid #333;
            padding: 6px 14px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            white-space: nowrap;
        }

        .cat-btn.active, .cat-btn:hover {
            background-color: #f3cc00;
            color: #000;
            border-color: #f3cc00;
        }

        /* Section Heading */
        .section-title {
            font-size: 22px;
            font-weight: 800;
            color: #f3cc00;
            border-left: 4px solid #f3cc00;
            padding-left: 10px;
            margin-bottom: 20px;
            letter-spacing: 0.5px;
        }

        /* Movie Card Design (Exact as screenshot) */
        .movie-card {
            background-color: #161616;
            border: 1px solid #262626;
            border-radius: 14px;
            overflow: hidden;
            margin-bottom: 25px;
            padding-bottom: 15px;
        }

        .movie-poster {
            width: 100%;
            height: 420px;
            object-fit: cover;
            display: block;
        }

        .movie-info {
            padding: 15px 15px 5px 15px;
        }

        .movie-rating {
            color: #f3cc00;
            font-weight: 700;
            font-size: 14px;
            margin-bottom: 6px;
        }

        .movie-name {
            font-size: 20px;
            font-weight: 700;
            color: #fff;
            margin-bottom: 15px;
        }

        .details-btn {
            width: calc(100% - 30px);
            margin: 0 15px;
            background-color: #222;
            color: #fff;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            text-align: center;
            transition: background 0.2s;
        }

        .details-btn:hover {
            background-color: #333;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Logo -->
        <div class="logo">huzfasnet</div>

        <!-- Search Input -->
        <input type="text" id="searchInput" class="search-box" placeholder="Search movies or series..." onkeyup="filterMovies()">

        <!-- Dark Mode Button -->
        <button id="themeToggleBtn" onclick="toggleTheme()" class="theme-btn">🌙 Dark Mode</button>

        <!-- Categories -->
        <div class="categories-nav">
            <button class="cat-btn active" onclick="filterCategory('all')">🔥 All</button>
            <button class="cat-btn" onclick="filterCategory('hollywood')">🎬 Hollywood</button>
            <button class="cat-btn" onclick="filterCategory('bollywood')">🍿 Bollywood</button>
            <button class="cat-btn" onclick="filterCategory('cyber')">💻 Cyber/Sci-Fi</button>
        </div>

        <!-- Section Title -->
        <div class="section-title">Curated Masterpieces</div>

        <!-- Movie List Grid -->
        <div id="movieGrid">
            <!-- 1. The Matrix -->
            <div class="movie-card" data-category="hollywood cyber" data-title="the matrix">
                <img src="https://images.unsplash.com/photo-1526374965328-7f61d4dc18c5?auto=format&fit=crop&w=600&q=80" class="movie-poster" alt="The Matrix">
                <div class="movie-info">
                    <div class="movie-rating">★ 8.7/10</div>
                    <div class="movie-name">The Matrix</div>
                </div>
                <button class="details-btn" onclick="alert('The Matrix: A computer hacker learns the true nature of his reality.')">Details</button>
            </div>

            <!-- 2. Interstellar -->
            <div class="movie-card" data-category="hollywood cyber" data-title="interstellar">
                <img src="https://images.unsplash.com/photo-1451187580459-43490279c0fa?auto=format&fit=crop&w=600&q=80" class="movie-poster" alt="Interstellar">
                <div class="movie-info">
                    <div class="movie-rating">★ 8.6/10</div>
                    <div class="movie-name">Interstellar</div>
                </div>
                <button class="details-btn" onclick="alert('Interstellar: A team of explorers travel through a wormhole in space.')">Details</button>
            </div>

            <!-- 3. 3 Idiots -->
            <div class="movie-card" data-category="bollywood" data-title="3 idiots">
                <img src="https://images.unsplash.com/photo-1485846234645-a62644f84728?auto=format&fit=crop&w=600&q=80" class="movie-poster" alt="3 Idiots">
                <div class="movie-info">
                    <div class="movie-rating">★ 8.4/10</div>
                    <div class="movie-name">3 Idiots</div>
                </div>
                <button class="details-btn" onclick="alert('3 Idiots: Two friends search for their long lost college companion.')">Details</button>
            </div>

            <!-- 4. Pathaan -->
            <div class="movie-card" data-category="bollywood" data-title="pathaan">
                <img src="https://images.unsplash.com/photo-1536440136628-849c177e76a1?auto=format&fit=crop&w=600&q=80" class="movie-poster" alt="Pathaan">
                <div class="movie-info">
                    <div class="movie-rating">★ 7.2/10</div>
                    <div class="movie-name">Pathaan</div>
                </div>
                <button class="details-btn" onclick="alert('Pathaan: An exiled RAW agent takes down a ruthless terrorist outfit.')">Details</button>
            </div>

            <!-- 5. Mr. Robot -->
            <div class="movie-card" data-category="cyber" data-title="mr robot">
                <img src="https://images.unsplash.com/photo-1563986768609-322da13575f3?auto=format&fit=crop&w=600&q=80" class="movie-poster" alt="Mr. Robot">
                <div class="movie-info">
                    <div class="movie-rating">★ 8.5/10</div>
                    <div class="movie-name">Mr. Robot Chronicles</div>
                </div>
                <button class="details-btn" onclick="alert('Mr. Robot Chronicles: Cyber security engineer by day and vigilante hacker by night.')">Details</button>
            </div>
        </div>
    </div>

    <script>
        // Dark & Light Mode Toggle
        function toggleTheme() {
            const body = document.body;
            const btn = document.getElementById('themeToggleBtn');
            
            if (body.style.backgroundColor === 'rgb(248, 250, 252)') {
                body.style.backgroundColor = '#0b0b0b';
                body.style.color = '#f1f1f1';
                localStorage.setItem('userTheme', 'dark');
                if (btn) btn.innerHTML = '🌙 Dark Mode';
            } else {
                body.style.backgroundColor = '#f8fafc';
                body.style.color = '#0f172a';
                localStorage.setItem('userTheme', 'light');
                if (btn) btn.innerHTML = '☀️ Light Mode';
            }
        }

        // Category Filter
        function filterCategory(category) {
            document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
            event.target.classList.add('active');

            let cards = document.querySelectorAll('.movie-card');
            cards.forEach(card => {
                let catAttr = card.getAttribute('data-category');
                if (category === 'all' || catAttr.includes(category)) {
                    card.style.display = 'block';
                } else {
                    card.style.display = 'none';
                }
            });
        }

        // Search Filter
        function filterMovies() {
            let query = document.getElementById('searchInput').value.toLowerCase();
            let cards = document.querySelectorAll('.movie-card');

            cards.forEach(card => {
                let title = card.getAttribute('data-title');
                if (title.includes(query)) {
                    card.style.display = 'block';
                } else {
                    card.style.display = 'none';
                }
            });
        }
    </script>
</body>
    </html>

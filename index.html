<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Huafsnet - Ultimate Movie Database</title>
    <style>
        :root {
            --bg-color: #071f1c;
            --text-color: #e0f7fa;
            --card-bg: #0d2b27;
            --header-bg: #031412;
            --header-text: #00e5ff;
            --border-color: #004d40;
            --accent-glow: rgba(0, 229, 255, 0.2);
        }

        [data-theme="light"] {
            --bg-color: #e0f2f1;
            --text-color: #00251a;
            --card-bg: #ffffff;
            --header-bg: #004d40;
            --header-text: #80d8ff;
            --border-color: #b2dfdb;
            --accent-glow: rgba(0, 0, 0, 0.1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            transition: background 0.3s ease, color 0.3s ease, transform 0.2s ease;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
        }

        header {
            background-color: var(--header-bg);
            color: var(--header-text);
            padding: 1.5rem 3rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 3px solid #00e5ff;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .logo-area {
            display: flex;
            flex-direction: column;
        }

        .logo {
            font-size: 2.3rem;
            font-weight: 900;
            letter-spacing: 2px;
            color: #00e5ff;
            text-transform: uppercase;
            text-shadow: 0 0 10px rgba(0, 229, 255, 0.5);
        }

        .tagline {
            font-size: 0.8rem;
            opacity: 0.7;
            letter-spacing: 1px;
        }

        .search-container {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        #searchBox {
            padding: 12px 18px;
            width: 340px;
            border-radius: 30px;
            border: 2px solid var(--border-color);
            background: rgba(0, 0, 0, 0.3);
            color: var(--text-color);
            outline: none;
            font-size: 1rem;
        }

        #searchBox:focus {
            border-color: #00e5ff;
            box-shadow: 0 0 10px var(--accent-glow);
        }

        #searchBox::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }

        .theme-toggle {
            background: #00e5ff;
            color: #031412;
            border: none;
            padding: 10px 18px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 30px;
            font-size: 0.9rem;
            box-shadow: 0 0 10px rgba(0, 229, 255, 0.3);
        }

        .theme-toggle:hover {
            background: #80d8ff;
            transform: scale(1.05);
        }

        .nav-categories {
            display: flex;
            gap: 15px;
            padding: 15px 3rem;
            background: var(--card-bg);
            border-bottom: 2px solid var(--border-color);
            overflow-x: auto;
        }

        .cat-btn {
            background: transparent;
            border: 2px solid var(--border-color);
            color: var(--text-color);
            font-weight: 700;
            cursor: pointer;
            padding: 8px 18px;
            border-radius: 20px;
            font-size: 0.95rem;
            white-space: nowrap;
        }

        .cat-btn.active, .cat-btn:hover {
            background: #00e5ff;
            color: #031412;
            border-color: #00e5ff;
            box-shadow: 0 0 10px rgba(0, 229, 255, 0.4);
        }

        .container {
            max-width: 1400px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .section-title {
            font-size: 1.5rem;
            margin-bottom: 20px;
            color: #00e5ff;
            border-left: 5px solid #00e5ff;
            padding-left: 10px;
            font-weight: 800;
        }

        .movies-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 25px;
            margin-bottom: 40px;
        }

        .movie-card {
            background: var(--card-bg);
            border: 2px solid var(--border-color);
            border-radius: 12px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.4);
            position: relative;
        }

        .movie-card:hover {
            transform: translateY(-5px);
            border-color: #00e5ff;
            box-shadow: 0 10px 25px rgba(0, 229, 255, 0.2);
        }

        .movie-card img {
            width: 100%;
            height: 310px;
            object-fit: cover;
            background-color: #071f1c;
        }

        .movie-info {
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            flex-grow: 1;
        }

        .movie-title {
            font-size: 1.1rem;
            font-weight: bold;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .movie-meta {
            font-size: 0.9rem;
            opacity: 0.85;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .rating {
            color: #00e5ff;
            font-weight: bold;
        }

        .drive-btn {
            display: block;
            text-align: center;
            background: #00e5ff;
            color: #031412;
            padding: 10px;
            border-radius: 8px;
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: bold;
            margin-top: auto;
            box-shadow: 0 4px 10px rgba(0, 229, 255, 0.2);
        }

        .drive-btn:hover {
            background: #4dd0e1;
            box-shadow: 0 6px 15px rgba(0, 229, 255, 0.4);
        }

        footer {
            background-color: var(--header-bg);
            color: var(--text-color);
            text-align: center;
            padding: 25px;
            border-top: 2px solid var(--border-color);
            margin-top: 50px;
            font-size: 0.95rem;
            opacity: 0.8;
        }

        @media(max-width: 768px) {
            header {
                flex-direction: column;
                gap: 15px;
                padding: 1rem;
                text-align: center;
            }
            .search-container {
                width: 100%;
                justify-content: center;
            }
            #searchBox {
                width: 100%;
            }
            .nav-categories {
                padding: 10px 1rem;
            }
        }
    </style>
</head>
<body data-theme="dark">

    <header>
        <div class="logo-area">
            <div class="logo">Huafsnet</div>
            <div class="tagline">Your Ultimate Cinematic Database</div>
        </div>
        <div class="search-container">
            <input type="text" id="searchBox" placeholder="Search Hollywood, Bollywood, K-Dramas..." onkeyup="filterMovies()">
            <button class="theme-toggle" onclick="toggleTheme()">Theme</button>
        </div>
    </header>

    <div class="nav-categories">
        <button class="cat-btn active" onclick="filterCategory('all', this)">All Masterpieces</button>
        <button class="cat-btn" onclick="filterCategory('hollywood', this)">Hollywood</button>
        <button class="cat-btn" onclick="filterCategory('bollywood', this)">Bollywood</button>
        <button class="cat-btn" onclick="filterCategory('korean', this)">Korean / K-Dramas</button>
    </div>

    <div class="container">
        <div class="movies-grid" id="moviesGrid">
            <!-- Rendered dynamically via JavaScript -->
        </div>
    </div>

    <footer>
        &copy; 2026 Huafsnet Database. Built for true cinema lovers. All rights reserved.
    </footer>

    <script>
        // Massive collection featuring top Hollywood, Bollywood, and Korean hits with certified working TMDB posters
        const movies = [
            // Hollywood Hits
            { title: "The Pursuit of Happyness", category: "hollywood", year: 2006, rating: 8.0, img: "https://image.tmdb.org/t/p/w500/carwNWDZhpGzWktc17WqIcfGqJg.jpg", drive: "YOUR_GOOGLE_DRIVE_LINK_HERE" },
            { title: "Fight Club", category: "hollywood", year: 1999, rating: 8.8, img: "https://image.tmdb.org/t/p/w500/pB8BM7pdSp6B6Ih7QZ4DrQ3PmJK.jpg", drive: "YOUR_GOOGLE_DRIVE_LINK_HERE" },
            { title: "Inception", category: "hollywood", year: 2010, rating: 8.8, img: "https://image.tmdb.org/t/p/w500/edv5CZvWj09upOsy2Y6IwDhK8bt.jpg", drive: "YOUR_GOOGLE_DRIVE_LINK_HERE" },
            { title: "Interstellar", category: "hollywood", year: 2014, rating: 8.7, img: "https://image.tmdb.org/t/p/w500/gEU2QniE6E77NI6lCU6MxlNBvIx.jpg", drive: "YOUR_GOOGLE_DRIVE_LINK_HERE" },
            { title: "The Dark Knight", category: "hollywood", year: 2008, rating: 9.0, img: "https://image.tmdb.org/t/p/w500/qJ2tW6WMUDux911r6m7haRef0WH.jpg", drive: "YOUR_GOOGLE_DRIVE_LINK_HERE" },
            { title: "Avatar: The Way of Water", category: "hollywood", year: 2022, rating: 7.6, img: "https://image.tmdb.org/t/p/w500/t6HIqrRAclMCA60NsSmeqe9RmNV.jpg", drive: "YOUR_GOOGLE_DRIVE_LINK_HERE" },

            // Bollywood Masterpieces
            { title: "3 Idiots", category: "bollywood", year: 2009, rating: 8.4, img: "https://image.tmdb.org/t/p/w500/66A9MqXOyVFCssoloscw79z8Tew.jpg", drive: "YOUR_GOOGLE_DRIVE_LINK_HERE" },
            { title: "Dangal", category: "bollywood", year: 2016, rating: 8.4, img: "https://image.tmdb.org/t/p/w500/c7a0y5dffg22k0l1d2m55f6g990.jpg", drive: "YOUR_GOOGLE_DRIVE_LINK_HERE" },
            { title: "Pathaan", category: "bollywood", year: 2023, rating: 6.0, img: "https://image.tmdb.org/t/p/w500/mYKngvX2qH416e7h5S13gWpGfQj.jpg", drive: "YOUR_GOOGLE_DRIVE_LINK_HERE" },
            { title: "Jawan", category: "bollywood", year: 2023, rating: 7.1, img: "https://image.tmdb.org/t/p/w500/j5bvn7cM859Z6qQ5T8r2J9jL9hG.jpg", drive: "YOUR_GOOGLE_DRIVE_LINK_HERE" },
            { title: "PK", category: "bollywood", year: 2014, rating: 8.1, img: "https://image.tmdb.org/t/p/w500/7s25thrQkuxUqFvYQ1S8m3T5g5x.jpg", drive: "YOUR_GOOGLE_DRIVE_LINK_HERE" },
            { title: "Shershaah", category: "bollywood", year: 2021, rating: 8.4, img: "https://image.tmdb.org/t/p/w500/fTqXzi622xq0Ctg4mC7i9R60249.jpg", drive: "YOUR_GOOGLE_DRIVE_LINK_HERE" },

            // Korean Sensations (Squid Game, All of Us Are Dead, Weak Hero, Train to Busan)
            { title: "Squid Game", category: "korean", year: 2021, rating: 8.0, img: "https://image.tmdb.org/t/p/w500/dDlEmu3EZ0Pgg93K2SVNLCjCSvE.jpg", drive: "YOUR_GOOGLE_DRIVE_LINK_HERE" },
            { title: "All of Us Are Dead", category: "korean", year: 2022, rating: 8.4, img: "https://image.tmdb.org/t/p/w500/pci1AwfzhPN09z8j3qZ77L5M9aH.jpg", drive: "YOUR_GOOGLE_DRIVE_LINK_HERE" },
            { title: "Weak Hero Class 1", category: "korean", year: 2022, rating: 8.8, img: "https://image.tmdb.org/t/p/w500/l9n6hI9yvVdEw0h8xR7lK6G76M.jpg", drive: "YOUR_GOOGLE_DRIVE_LINK_HERE" },
            { title: "Train to Busan", category: "korean", year: 2016, rating: 7.6, img: "https://image.tmdb.org/t/p/w500/d7oJcaR2xKCBX1i3gYVfU0WfG7z.jpg", drive: "YOUR_GOOGLE_DRIVE_LINK_HERE" },
            { title: "Vincenzo", category: "korean", year: 2021, rating: 8.5, img: "https://image.tmdb.org/t/p/w500/dvjhh823908j4172088f1929jZ.jpg", drive: "YOUR_GOOGLE_DRIVE_LINK_HERE" },
            { title: "Parasite", category: "korean", year: 2019, rating: 8.5, img: "https://image.tmdb.org/t/p/w500/7IiTTgloJzvGI1TAYymCfbfl3vT.jpg", drive: "YOUR_GOOGLE_DRIVE_LINK_HERE" }
        ];

        let currentCategory = 'all';

        function displayMovies(items) {
            const grid = document.getElementById('moviesGrid');
            grid.innerHTML = '';
            
            if (items.length === 0) {
                grid.innerHTML = '<p style="grid-column: 1/-1; text-align: center; padding: 40px; font-size: 1.2rem; opacity: 0.7;">No movies found matching your search.</p>';
                return;
            }

            items.forEach(movie => {
                const card = document.createElement('div');
                card.className = 'movie-card';
                card.innerHTML = `
                    <img src="${movie.img}" alt="${movie.title}" loading="lazy" onerror="this.src='https://image.tmdb.org/t/p/w500/carwNWDZhpGzWktc17WqIcfGqJg.jpg'">
                    <div class="movie-info">
                        <div class="movie-title">${movie.title}</div>
                        <div class="movie-meta">
                            <span>${movie.year}</span>
                            <span class="rating">★ ${movie.rating}</span>
                        </div>
                        <a href="${movie.drive}" target="_blank" class="drive-btn">Watch on Drive</a>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function filterMovies() {
            const query = document.getElementById('searchBox').value.toLowerCase();
            const filtered = movies.filter(movie => {
                const matchesSearch = movie.title.toLowerCase().includes(query);
                const matchesCategory = currentCategory === 'all' || movie.category === currentCategory;
                return matchesSearch && matchesCategory;
            });
            displayMovies(filtered);
        }

        function filterCategory(category, btn) {
            currentCategory = category;
            document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            filterMovies();
        }

        function toggleTheme() {
            const body = document.body;
            body.setAttribute('data-theme', body.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
        }

        // Initial launch load
        displayMovies(movies);
    </script>
</body>
    </html>

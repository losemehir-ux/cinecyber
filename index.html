<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Huafsnet - Movie Database</title>
    <style>
        :root {
            --bg-color: #f3f3f3;
            --text-color: #121212;
            --card-bg: #ffffff;
            --header-bg: #121212;
            --header-text: #f5c518;
            --border-color: #cccccc;
        }

        [data-theme="dark"] {
            --bg-color: #121212;
            --text-color: #ffffff;
            --card-bg: #1a1a1a;
            --header-bg: #000000;
            --header-text: #f5c518;
            --border-color: #333333;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            transition: background 0.3s, color 0.3s;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
        }

        header {
            background-color: var(--header-bg);
            color: var(--header-text);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #f5c518;
        }

        .logo {
            font-size: 1.8rem;
            font-weight: bold;
            letter-spacing: 1px;
        }

        .search-container {
            display: flex;
            gap: 10px;
        }

        #searchBox {
            padding: 8px 12px;
            width: 300px;
            border-radius: 4px;
            border: 1px solid var(--border-color);
            outline: none;
        }

        .theme-toggle {
            background: #f5c518;
            color: #000;
            border: none;
            padding: 8px 14px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 4px;
        }

        .nav-categories {
            display: flex;
            gap: 15px;
            padding: 10px 2rem;
            background: var(--card-bg);
            border-bottom: 1px solid var(--border-color);
        }

        .cat-btn {
            background: none;
            border: none;
            color: var(--text-color);
            font-weight: bold;
            cursor: pointer;
            padding: 5px 10px;
            border-radius: 3px;
        }

        .cat-btn.active, .cat-btn:hover {
            background: #f5c518;
            color: #000;
        }

        .container {
            max-width: 1200px;
            margin: 20px auto;
            padding: 0 20px;
        }

        .movies-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
        }

        .movie-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .movie-card img {
            width: 100%;
            height: 280px;
            object-fit: cover;
            background-color: #222;
        }

        .movie-info {
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            flex-grow: 1;
        }

        .movie-title {
            font-size: 1rem;
            font-weight: bold;
        }

        .movie-meta {
            font-size: 0.85rem;
            opacity: 0.8;
            display: flex;
            justify-content: space-between;
        }

        .rating {
            color: #f5c518;
            font-weight: bold;
        }

        @media(max-width: 768px) {
            header {
                flex-direction: column;
                gap: 15px;
            }
            #searchBox {
                width: 100%;
            }
        }
    </style>
</head>
<body data-theme="dark">

    <header>
        <div class="logo">Huafsnet</div>
        <div class="search-container">
            <input type="text" id="searchBox" placeholder="Search Hollywood, Bollywood..." onkeyup="filterMovies()">
        </div>
        <button class="theme-toggle" onclick="toggleTheme()">Light/Dark</button>
    </header>

    <div class="nav-categories">
        <button class="cat-btn active" onclick="filterCategory('all', this)">All</button>
        <button class="cat-btn" onclick="filterCategory('hollywood', this)">Hollywood</button>
        <button class="cat-btn" onclick="filterCategory('bollywood', this)">Bollywood</button>
    </div>

    <div class="container">
        <div class="movies-grid" id="moviesGrid">
            <!-- Movies will load here automatically -->
        </div>
    </div>

    <script>
        // Reliable working image URLs & categories
        const movies = [
            { title: "Inception", category: "hollywood", year: 2010, rating: 8.8, img: "https://images.unsplash.com/photo-1536440136628-849c177e76a1?auto=format&fit=crop&w=500&q=80" },
            { title: "Interstellar", category: "hollywood", year: 2014, rating: 8.7, img: "https://images.unsplash.com/photo-1506703719100-a0f3a48c0f86?auto=format&fit=crop&w=500&q=80" },
            { title: "Pathaan", category: "bollywood", year: 2023, rating: 6.0, img: "https://images.unsplash.com/photo-1485846234645-a62644f84728?auto=format&fit=crop&w=500&q=80" },
            { title: "3 Idiots", category: "bollywood", year: 2009, rating: 8.4, img: "https://images.unsplash.com/photo-1489599849927-2ee91cede3ba?auto=format&fit=crop&w=500&q=80" },
            { title: "The Dark Knight", category: "hollywood", year: 2008, rating: 9.0, img: "https://images.unsplash.com/photo-1509198397868-475647b2a1e5?auto=format&fit=crop&w=500&q=80" },
            { title: "Dangal", category: "bollywood", year: 2016, rating: 8.4, img: "https://images.unsplash.com/photo-1517604931442-7e0c8ed2963c?auto=format&fit=crop&w=500&q=80" }
        ];

        let currentCategory = 'all';

        function displayMovies(items) {
            const grid = document.getElementById('moviesGrid');
            grid.innerHTML = '';
            
            if (items.length === 0) {
                grid.innerHTML = '<p style="grid-column: 1/-1; text-align: center; padding: 40px;">No movies found.</p>';
                return;
            }

            items.forEach(movie => {
                const card = document.createElement('div');
                card.className = 'movie-card';
                card.innerHTML = `
                    <img src="${movie.img}" alt="${movie.title}" onerror="this.src='https://images.unsplash.com/photo-1485846234645-a62644f84728?auto=format&fit=crop&w=500&q=80'">
                    <div class="movie-info">
                        <div class="movie-title">${movie.title}</div>
                        <div class="movie-meta">
                            <span>${movie.year}</span>
                            <span class="rating">★ ${movie.rating}</span>
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function filterMovies() {
            const query = document.getElementById('searchBox').value.toLowerCase();
            const filtered = movies.filter(movie => {
                const matchesSearch = movie.title.toLowerCase().includes(query);
                const matchesCategory = currentCategory === 'all' || movie.category === currentCategory;
                return matchesSearch && matchesCategory;
            });
            displayMovies(filtered);
        }

        function filterCategory(category, btn) {
            currentCategory = category;
            document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            filterMovies();
        }

        function toggleTheme() {
            const body = document.body;
            if (body.getAttribute('data-theme') === 'dark') {
                body.setAttribute('data-theme', 'light');
            } else {
                body.setAttribute('data-theme', 'dark');
            }
        }

        // Initial load
        displayMovies(movies);
    </script>
</body>
</html>

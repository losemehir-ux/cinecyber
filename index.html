<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Huafsnet - Movie Database</title>
    <style>
        :root {
            --bg-color: #0b2522;
            --text-color: #e0f7fa;
            --card-bg: #103631;
            --header-bg: #051614;
            --header-text: #00bcd4;
            --border-color: #1b4d45;
        }

        [data-theme="light"] {
            --bg-color: #e8f5e9;
            --text-color: #00332c;
            --card-bg: #ffffff;
            --header-bg: #004d40;
            --header-text: #00e5ff;
            --border-color: #b2dfdb;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            transition: background 0.3s, color 0.3s;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
        }

        header {
            background-color: var(--header-bg);
            color: var(--header-text);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #00bcd4;
        }

        .logo {
            font-size: 1.8rem;
            font-weight: bold;
            letter-spacing: 1px;
            color: #00bcd4;
        }

        .search-container {
            display: flex;
            gap: 10px;
        }

        #searchBox {
            padding: 8px 12px;
            width: 300px;
            border-radius: 4px;
            border: 1px solid var(--border-color);
            background: rgba(0, 0, 0, 0.3);
            color: var(--text-color);
            outline: none;
        }

        #searchBox::placeholder {
            color: rgba(255, 255, 255, 0.6);
        }

        .theme-toggle {
            background: #00bcd4;
            color: #051614;
            border: none;
            padding: 8px 14px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 4px;
        }

        .nav-categories {
            display: flex;
            gap: 15px;
            padding: 10px 2rem;
            background: var(--card-bg);
            border-bottom: 1px solid var(--border-color);
        }

        .cat-btn {
            background: none;
            border: none;
            color: var(--text-color);
            font-weight: bold;
            cursor: pointer;
            padding: 5px 10px;
            border-radius: 3px;
        }

        .cat-btn.active, .cat-btn:hover {
            background: #00bcd4;
            color: #051614;
        }

        .container {
            max-width: 1200px;
            margin: 20px auto;
            padding: 0 20px;
        }

        .movies-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
        }

        .movie-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.4);
        }

        .movie-card img {
            width: 100%;
            height: 280px;
            object-fit: cover;
            background-color: #0b2522;
        }

        .movie-info {
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            flex-grow: 1;
        }

        .movie-title {
            font-size: 1rem;
            font-weight: bold;
        }

        .movie-meta {
            font-size: 0.85rem;
            opacity: 0.85;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .rating {
            color: #00bcd4;
            font-weight: bold;
        }

        .drive-btn {
            display: block;
            text-align: center;
            background: #00bcd4;
            color: #051614;
            padding: 7px;
            border-radius: 4px;
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: bold;
            margin-top: 8px;
        }

        .drive-btn:hover {
            background: #26c6da;
        }

        @media(max-width: 768px) {
            header {
                flex-direction: column;
                gap: 15px;
            }
            #searchBox {
                width: 100%;
            }
        }
    </style>
</head>
<body data-theme="dark">

    <header>
        <div class="logo">Huafsnet</div>
        <div class="search-container">
            <input type="text" id="searchBox" placeholder="Search Hollywood, Bollywood..." onkeyup="filterMovies()">
        </div>
        <button class="theme-toggle" onclick="toggleTheme()">Light/Dark</button>
    </header>

    <div class="nav-categories">
        <button class="cat-btn active" onclick="filterCategory('all', this)">All</button>
        <button class="cat-btn" onclick="filterCategory('hollywood', this)">Hollywood</button>
        <button class="cat-btn" onclick="filterCategory('bollywood', this)">Bollywood</button>
    </div>

    <div class="container">
        <div class="movies-grid" id="moviesGrid">
            <!-- Dynamic Movies -->
        </div>
    </div>

    <script>
        // 100% Tested Working Movies with Google Drive Links Integration
        const movies = [
            { title: "Inception", category: "hollywood", year: 2010, rating: 8.8, img: "https://image.tmdb.org/t/p/w500/edv5CZvWj09upOsy2Y6IwDhK8bt.jpg", drive: "YOUR_GOOGLE_DRIVE_LINK_HERE" },
            { title: "Interstellar", category: "hollywood", year: 2014, rating: 8.7, img: "https://image.tmdb.org/t/p/w500/gEU2QniE6E77NI6lCU6MxlNBvIx.jpg", drive: "YOUR_GOOGLE_DRIVE_LINK_HERE" },
            { title: "The Dark Knight", category: "hollywood", year: 2008, rating: 9.0, img: "https://image.tmdb.org/t/p/w500/qJ2tW6WMUDux911r6m7haRef0WH.jpg", drive: "YOUR_GOOGLE_DRIVE_LINK_HERE" },
            { title: "Avatar: The Way of Water", category: "hollywood", year: 2022, rating: 7.6, img: "https://image.tmdb.org/t/p/w500/t6HIqrRAclMCA60NsSmeqe9RmNV.jpg", drive: "YOUR_GOOGLE_DRIVE_LINK_HERE" },
            { title: "Avengers: Endgame", category: "hollywood", year: 2019, rating: 8.4, img: "https://image.tmdb.org/t/p/w500/or06FN3Dka5tukK1e9sl16pB3iy.jpg", drive: "YOUR_GOOGLE_DRIVE_LINK_HERE" },
            { title: "Pathaan", category: "bollywood", year: 2023, rating: 6.0, img: "https://image.tmdb.org/t/p/w500/mYKngvX2qH416e7h5S13gWpGfQj.jpg", drive: "YOUR_GOOGLE_DRIVE_LINK_HERE" },
            { title: "3 Idiots", category: "bollywood", year: 2009, rating: 8.4, img: "https://image.tmdb.org/t/p/w500/66A9MqXOyVFCssoloscw79z8Tew.jpg", drive: "YOUR_GOOGLE_DRIVE_LINK_HERE" },
            { title: "Jawan", category: "bollywood", year: 2023, rating: 7.1, img: "https://image.tmdb.org/t/p/w500/j5bvn7cM859Z6qQ5T8r2J9jL9hG.jpg", drive: "YOUR_GOOGLE_DRIVE_LINK_HERE" }
        ];

        let currentCategory = 'all';

        function displayMovies(items) {
            const grid = document.getElementById('moviesGrid');
            grid.innerHTML = '';
            
            if (items.length === 0) {
                grid.innerHTML = '<p style="grid-column: 1/-1; text-align: center; padding: 40px;">No movies found.</p>';
                return;
            }

            items.forEach(movie => {
                const card = document.createElement('div');
                card.className = 'movie-card';
                card.innerHTML = `
                    <img src="${movie.img}" alt="${movie.title}" loading="lazy">
                    <div class="movie-info">
                        <div class="movie-title">${movie.title}</div>
                        <div class="movie-meta">
                            <span>${movie.year}</span>
                            <span class="rating">★ ${movie.rating}</span>
                        </div>
                        <a href="${movie.drive}" target="_blank" class="drive-btn">Google Drive Link</a>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function filterMovies() {
            const query = document.getElementById('searchBox').value.toLowerCase();
            const filtered = movies.filter(movie => {
                const matchesSearch = movie.title.toLowerCase().includes(query);
                const matchesCategory = currentCategory === 'all' || movie.category === currentCategory;
                return matchesSearch && matchesCategory;
            });
            displayMovies(filtered);
        }

        function filterCategory(category, btn) {
            currentCategory = category;
            document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            filterMovies();
        }

        function toggleTheme() {
            const body = document.body;
            body.setAttribute('data-theme', body.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
        }

        displayMovies(movies);
    </script>
</body>
</html>

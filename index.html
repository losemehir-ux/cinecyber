        body {

        }

            font-weight: 600;
            letter-spacing: 1px;
            color: #e0e0e0;
            margin-bottom: 5px;
        }

        header p {
            color: #888;
            font-size: 14px;
        }

        .search-container {
            max-width: 600px;
            margin: 25px auto 10px auto;
            padding: 0 20px;
            display: flex;
            gap: 10px;
        }

        .search-bar {
            width: 100%;
            padding: 12px 20px;
            background: #121212;
            border: 1px solid #333;
            border-radius: 8px;
            color: #fff;
            font-size: 15px;
            outline: none;
            transition: border-color 0.3s;
        }

        .search-bar:focus {
            border-color: #666;
        }

        .categories {
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
            padding: 15px 20px;
            max-width: 900px;
            margin: 0 auto;
        }

        .cat-btn {
            background: #141414;
            color: #bbb;
            border: 1px solid #262626;
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.2s ease;
        }

        .cat-btn:hover, .cat-btn.active {
            background: #fff;
            color: #000;
            border-color: #fff;
        }

        .container {
            max-width: 1300px;
            margin: 20px auto;
            padding: 0 20px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 20px;
            flex: 1;
            width: 100%;
        }

        .card {
            background: #111;
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid #1f1f1f;
            display: flex;
            flex-direction: column;
            transition: transform 0.2s;
        }

        .card:hover {
            transform: translateY(-4px);
            border-color: #333;
        }

        .card-img-wrapper {
            width: 100%;
            height: 160px;
            overflow: hidden;
            background: #181818;
            position: relative;
        }

        .card-img-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.3s;
        }

        .card:hover .card-img-wrapper img {
            transform: scale(1.05);
        }

        .card-content {
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            flex: 1;
            justify-content: space-between;
        }

        .card-title {
            font-size: 14px;
            font-weight: 500;
            color: #ddd;
        }

        .card-footer-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .rating {
            color: #f39c12;
            font-size: 13px;
            cursor: pointer;
        }

        .download-btn {
            background: #ffffff;
            color: #000000;
            text-decoration: none;
            padding: 6px 14px;
            font-size: 12px;
            font-weight: 600;
            border-radius: 5px;
            transition: background 0.2s;
            display: inline-block;
        }

        .download-btn:hover {
            background: #dcdcdc;
        }

        footer {
            text-align: center;
            padding: 25px;
            border-top: 1px solid #222;
            color: #666;
            font-size: 13px;
            background: #0a0a0a;
            margin-top: 40px;
        }

        @media (max-width: 600px) {
            .container {
                grid-template-columns: repeat(auto-fill, minmax(100%, 1fr));

        let currentCategory = 'all';

        function renderWallpapers(filteredList) {
            const grid = document.getElementById('wallpaperGrid');
            grid.innerHTML = '';

            if (filteredList.length === 0) {
                grid.innerHTML = `<p style="grid-column: 1/-1; text-align: center; color: #777; padding: 40px;">No wallpapers found!</p>`;
                return;
            }

            filteredList.forEach(item => {
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <div class="card-img-wrapper">
                        <img src="${item.img}" alt="${item.title}" loading="lazy">
                    </div>
                    <div class="card-content">
                        <div>
                            <div class="card-title">${item.title}</div>
                            <span style="font-size: 11px; color: #666;">${item.category}</span>
                        </div>
                        <div class="card-footer-info">
                            <span class="rating" onclick="rateWallpaper(this)">${item.rating}</span>
                            <a href="${item.img}" target="_blank" download class="download-btn">Download</a>
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function filterCategory(category, btn) {
            currentCategory = category;
            
            // Update active button styles
            document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');

            applyFilters();
        }

        function filterWallpapers() {
            applyFilters();
        }

        function applyFilters() {
            const searchQuery = document.getElementById('searchInput').value.toLowerCase();
            
            let result = wallpapers;

            // Category filter
            if (currentCategory !== 'all') {
                result = result.filter(w => w.category === currentCategory);
            }

            // Search query filter
            if (searchQuery.trim() !== '') {
                result = result.filter(w => 
                    w.title.toLowerCase().includes(searchQuery) || 
                    w.category.toLowerCase().includes(searchQuery)
                );
            }

            renderWallpapers(result);
        }

        function rateWallpaper(element) {
            element.innerHTML = "★ 5.0 (Rated!)";
            element.style.color = "#2ecc71";
        }

        // Initial render
        renderWallpapers(wallpapers);
    </script>

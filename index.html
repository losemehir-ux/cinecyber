<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HuzafsTech - AI Prompt Hub</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        darkbg: '#0b0f0e',
                        cardbg: '#131b18',
                        neoncyan: '#00f2fe',
                        neongreen: '#00ff87',
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-darkbg text-gray-200 min-h-screen font-sans selection:bg-neoncyan selection:text-black">

    <!-- Header / Navbar -->
    <header class="border-b border-gray-800 bg-cardbg/50 backdrop-blur sticky top-0 z-50">
        <div class="max-w-6xl mx-auto px-4 py-4 flex justify-between items-center">
            <div class="flex items-center space-x-2">
                <i class="fa-solid fa-terminal text-neoncyan text-2xl"></i>
                <span class="text-xl font-bold tracking-wider bg-gradient-to-r from-neoncyan to-neongreen bg-clip-text text-transparent">HuzafsTech</span>
            </div>
            <button onclick="openModal()" class="bg-gradient-to-r from-neoncyan to-neongreen text-black font-semibold px-4 py-2 rounded-lg text-sm hover:opacity-90 transition shadow-lg shadow-neoncyan/20">
                <i class="fa-solid fa-plus mr-1"></i> Add Prompt
            </button>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-6xl mx-auto px-4 py-8">
        
        <!-- Hero Section -->
        <div class="text-center mb-10">
            <h1 class="text-3xl md:text-5xl font-extrabold mb-4">Discover & Share Best <span class="text-neoncyan">AI Prompts</span></h1>
            <p class="text-gray-400 max-w-xl mx-auto text-sm md:text-base">Welcome to HuzafsTech! Coding, Image Editing, aur Car/Cinematic AI prompts ka sabse behtareen collection.</p>
            
            <!-- Search & Filter Bar -->
            <div class="mt-6 max-w-md mx-auto relative">
                <i class="fa-solid fa-magnifying-glass absolute left-4 top-3.5 text-gray-500"></i>
                <input type="text" id="searchInput" onkeyup="filterPrompts()" placeholder="Search prompts (e.g. car, photo, coding)..." class="w-full bg-cardbg border border-gray-800 rounded-xl pl-11 pr-4 py-3 text-sm focus:outline-none focus:border-neoncyan transition text-gray-200">
            </div>
        </div>

        <!-- Prompts Grid -->
        <div id="promptGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <!-- Cards will be dynamically injected here via JS -->
        </div>
    </main>

    <!-- Add Prompt Modal -->
    <div id="promptModal" class="fixed inset-0 bg-black/70 backdrop-blur-sm hidden justify-center items-center z-50 px-4">
        <div class="bg-cardbg border border-gray-800 w-full max-w-lg rounded-2xl p-6 shadow-2xl relative">
            <h2 class="text-xl font-bold mb-4 text-neoncyan">Add New Prompt</h2>
            <form id="addForm" onsubmit="addPrompt(event)">
                <div class="mb-4">
                    <label class="block text-xs uppercase tracking-wider text-gray-400 mb-2">Title</label>
                    <input type="text" id="newTitle" required class="w-full bg-darkbg border border-gray-800 rounded-lg p-3 text-sm focus:outline-none focus:border-neoncyan text-gray-200" placeholder="e.g. Cyberpunk Car Portrait">
                </div>
                <div class="mb-4">
                    <label class="block text-xs uppercase tracking-wider text-gray-400 mb-2">Category</label>
                    <input type="text" id="newCategory" required class="w-full bg-darkbg border border-gray-800 rounded-lg p-3 text-sm focus:outline-none focus:border-neoncyan text-gray-200" placeholder="e.g. Image Editing">
                </div>
                <div class="mb-4">
                    <label class="block text-xs uppercase tracking-wider text-gray-400 mb-2">Prompt Text</label>
                    <textarea id="newText" rows="4" required class="w-full bg-darkbg border border-gray-800 rounded-lg p-3 text-sm focus:outline-none focus:border-neoncyan text-gray-200" placeholder="Write your detailed prompt here..."></textarea>
                </div>
                <div class="flex justify-end space-x-3">
                    <button type="button" onclick="closeModal()" class="px-4 py-2 rounded-lg text-sm bg-gray-800 text-gray-300 hover:bg-gray-700 transition">Cancel</button>
                    <button type="submit" class="px-4 py-2 rounded-lg text-sm bg-neongreen text-black font-semibold hover:opacity-90 transition">Save Prompt</button>
                </div>
            </form>
        </div>
    </div>

    <!-- JavaScript Logic -->
    <script>
        // Updated Prompts Data including Image Editing, Cars & Coding
        let prompts = [
            {
                id: 1,
                title: "Cinematic Car Photo Enhancer",
                category: "Image Editing",
                text: "Transform this car photo into a high-end cinematic shot. Enhance the glossy reflections on the body paint, add moody neon street lighting reflecting on wet asphalt, 8k resolution, photorealistic."
            },
            {
                id: 2,
                title: "Professional Portrait Retouch",
                category: "Image Editing",
                text: "Retouch this person's portrait naturally. Improve lighting, smooth skin texture while keeping realistic pores, adjust color grading to a warm golden-hour tone, professional studio quality."
            },
            {
                id: 3,
                title: "Cyberpunk Sports Car Render",
                category: "Cars & AI",
                text: "Generate a futuristic sports car driving through a neon-lit Tokyo alley at night. Heavy cyberpunk aesthetics, glowing cyan and magenta lights, rain puddles reflecting neon signs, hyper-detailed."
            },
            {
                id: 4,
                title: "Clean Code & Refactor Assistant",
                category: "Coding",
                text: "Act as a senior software engineer. Review the following code, identify performance bottlenecks, clean up redundant lines, and rewrite it following best practices."
            },
            {
                id: 5,
                title: "Anime / Cartoon Style Avatar",
                category: "Image Editing",
                text: "Convert this user photo into a high-quality modern 3D anime character style, vibrant colors, soft studio lighting, detailed facial expressions, Pixar/Disney 3D animation look."
            },
            {
                id: 6,
                title: "Luxury Car Showroom Background",
                category: "Cars & AI",
                text: "Place this car inside a minimalist, futuristic luxury glass showroom with subtle spotlights highlighting the vehicle curves, dark polished concrete floor, ultra-realistic."
            }
        ];

        // Render Prompts on Page Load
        function renderPrompts(data) {
            const grid = document.getElementById('promptGrid');
            grid.innerHTML = '';

            if(data.length === 0) {
                grid.innerHTML = `<p class="text-gray-500 col-span-full text-center py-10">No prompts found.</p>`;
                return;
            }

            data.forEach(item => {
                grid.innerHTML += `
                    <div class="bg-cardbg border border-gray-800/80 rounded-2xl p-5 flex flex-col justify-between hover:border-neoncyan/50 transition duration-300 group shadow-lg">
                        <div>
                            <div class="flex justify-between items-center mb-3">
                                <span class="text-xs font-semibold px-2.5 py-1 rounded-full bg-neoncyan/10 text-neoncyan border border-neoncyan/20">${item.category}</span>
                                <i class="fa-regular fa-bookmark text-gray-500 group-hover:text-neongreen transition cursor-pointer"></i>
                            </div>
                            <h3 class="text-lg font-bold mb-2 text-gray-100">${item.title}</h3>
                            <p class="text-gray-400 text-sm mb-4 bg-darkbg/50 p-3 rounded-xl border border-gray-800/50 font-mono text-xs line-clamp-3">${item.text}</p>
                        </div>
                        <button onclick="copyPrompt('${item.text.replace(/'/g, "\\'")}', this)" class="w-full bg-gray-800 hover:bg-neoncyan hover:text-black text-gray-200 py-2.5 rounded-xl text-xs font-semibold transition flex items-center justify-center space-x-2">
                            <i class="fa-regular fa-copy"></i>
                            <span>Copy Prompt</span>
                        </button>
                    </div>
                `;
            });
        }

        // Copy Function with Feedback
        function copyPrompt(text, btn) {
            navigator.clipboard.writeText(text);
            const originalHTML = btn.innerHTML;
            btn.innerHTML = `<i class="fa-solid fa-check text-black"></i> <span>Copied!</span>`;
            btn.classList.add('bg-neongreen', 'text-black');
            setTimeout(() => {
                btn.innerHTML = originalHTML;
                btn.classList.remove('bg-neongreen', 'text-black');
            }, 2000);
        }

        // Search/Filter Function
        function filterPrompts() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const filtered = prompts.filter(p => 
                p.title.toLowerCase().includes(query) || 
                p.category.toLowerCase().includes(query) || 
                p.text.toLowerCase().includes(query)
            );
            renderPrompts(filtered);
        }

        // Modal Controls
        function openModal() {
            document.getElementById('promptModal').classList.remove('hidden');
            document.getElementById('promptModal').classList.add('flex');
        }

        backgroundClose = function() {
            closeModal();
        }

        function closeModal() {
            document.getElementById('promptModal').classList.remove('flex');
            document.getElementById('promptModal').classList.add('hidden');
            document.getElementById('addForm').reset();
        }

        // Add New Prompt Handler
        function addPrompt(e) {
            e.preventDefault();
            const title = document.getElementById('newTitle').value;
            const category = document.getElementById('newCategory').value;
            const text = document.getElementById('newText').value;

            const newObj = {
                id: prompts.length + 1,
                title,
                category,
                text
            };

            prompts.unshift(newObj);
            renderPrompts(prompts);
            closeModal();
        }

        // Initial Call
        renderPrompts(prompts);
    </script>
</body>
</html>
